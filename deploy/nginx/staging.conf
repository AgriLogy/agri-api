    # --- Strangler cutovers (fastapp :9001) go here, most specific first ---
    # F2: /weather/* served by fastapp (PR — 2026-07-03). Read-only ET0
    # forecast; byte-parity verified (fastapp/tests/test_weather_parity.py).
    # Rollback = delete this block + `nginx -t && systemctl reload nginx`.
    location /weather/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

