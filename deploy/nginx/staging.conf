# =============================================================================
# staging.agrogo-datafarm.com — nginx server blocks (STAGING MIRROR)
# =============================================================================
#
# A faithful, mechanical transform of deploy/nginx/back.conf (the prod
# strangler source of truth). Every `location` block below appears in the SAME
# ORDER, with the SAME matching modifier (`=` exact vs prefix), as in back.conf
# — so a request routes to the same role (Django vs fastapp) on staging as it
# does on prod. Only four things changed:
#
#     server_name           back.  →  staging.agrogo-datafarm.com
#     fastapp upstream      127.0.0.1:8001  →  127.0.0.1:9001
#     Django  upstream      127.0.0.1:8000  →  127.0.0.1:9000
#     certificate paths     /etc/letsencrypt/live/back...  →  .../staging...
#
# HOW TO KEEP THEM IN SYNC
# ------------------------
# back.conf stays the source of truth. When a cutover adds a location block
# there, regenerate this file rather than hand-editing:
#
#     awk '/^server \{/{f=1} f' deploy/nginx/back.conf \
#       | sed -e 's#127\.0\.0\.1:8001#127.0.0.1:9001#g' \
#             -e 's#127\.0\.0\.1:8000#127.0.0.1:9000#g' \
#             -e 's#back\.agrogo-datafarm\.com#staging.agrogo-datafarm.com#g'
#
# and re-attach this header. Verify equivalence with:
#
#     diff <(grep -E '^\s+location ' deploy/nginx/back.conf) \
#          <(grep -E '^\s+location ' deploy/nginx/staging.conf)   # must be empty
#
# ⚠️ NAMING: the staging Vercel FRONT-END was also sketched for
# `staging.agrogo-datafarm.com` in the original plan. Both cannot own the name.
# This file follows issue #425 and gives the API host `staging.`; if the owner
# prefers the front-end there, rename to `staging-back.agrogo-datafarm.com`
# here, in deploy/staging/env.example (ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS) and
# in the DNS record. Decide BEFORE issuing the certificate.
#
# NOTHING HERE HAS BEEN APPLIED. Applying is manual (like back.conf and
# grafana.conf — the deploy pipeline does not sync nginx):
#
#     sudo cp deploy/nginx/staging.conf /etc/nginx/sites-available/staging
#     sudo ln -sf /etc/nginx/sites-available/staging /etc/nginx/sites-enabled/staging
#     sudo certbot --nginx -d staging.agrogo-datafarm.com
#     sudo nginx -t && sudo systemctl reload nginx
#
# (Point a DNS A record staging.agrogo-datafarm.com → the droplet FIRST, and
# comment out the `listen 443` + ssl_* lines below until certbot has run —
# nginx will not start referencing a certificate that does not exist yet.)
# =============================================================================

server {
