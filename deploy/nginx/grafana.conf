# Host nginx site for Grafana (the log-observability UI).
#
# Grafana listens ONLY on 127.0.0.1:3000 (deploy/observability/
# docker-compose.observability.yml); this is the sole public entry point.
# Mirror of the droplet's /etc/nginx/sites-enabled/grafana — applying it is
# manual (like back.conf), NOT synced by the deploy pipeline:
#
#   sudo cp deploy/nginx/grafana.conf /etc/nginx/sites-available/grafana
#   sudo ln -sf /etc/nginx/sites-available/grafana /etc/nginx/sites-enabled/grafana
#   sudo certbot --nginx -d grafana.agrogo-datafarm.com   # adds the 443 block + redirect
#   sudo nginx -t && sudo systemctl reload nginx
#
# (Point a DNS A record grafana.agrogo-datafarm.com → the droplet first.)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.agrogo-datafarm.com;

    # Grafana handles its own auth; keep bodies modest (dashboard imports).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live (dashboard streaming) needs WebSocket upgrade.
    location /api/live/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
