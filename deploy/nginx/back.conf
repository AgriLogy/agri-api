# =============================================================================
# back.agrogo-datafarm.com — nginx server blocks (STRANGLER SOURCE OF TRUTH)
# =============================================================================
#
# This file is the repo-tracked source of truth for the API host's nginx
# config during the Django→FastAPI strangler migration. It is a faithful
# copy of the live blocks captured from the droplet (157.245.43.196,
# /etc/nginx/sites-enabled/*) on 2026-07-02 — baseline state: EVERYTHING
# proxies to the Django app on 127.0.0.1:8000; the FastAPI sidecar
# (agri-api-fast, 127.0.0.1:8001) serves no public prefix yet.
#
# HOW A CUTOVER WORKS
# -------------------
# Each phase moves one path prefix from Django to fastapp by adding a
# location block ABOVE the catch-all `location /`, e.g.:
#
#     # F<N>: <prefix> served by fastapp since <date> / PR #<n>
#     location /weather/ {
#         proxy_pass http://127.0.0.1:8001;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#
# Rollback = delete the block (Django still serves the same routes until a
# later phase removes them). Apply on the droplet with:
#     nginx -t && systemctl reload nginx
#
# NOTE: applying this file is still MANUAL (deploy-back.yml does not sync it
# yet — wiring auto-apply into the deploy pipeline is a tracked follow-up).
# Until then, edit here first, then mirror the change on the droplet.
# =============================================================================

