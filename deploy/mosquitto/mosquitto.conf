# Dev MQTT broker for the local ingest stack.
#
# This broker exists so `make up` gives a working end-to-end MQTT path offline
# (publish an uplink → agri-api-mqtt persists it). In PRODUCTION the subscriber
# does NOT use this broker: MQTT_HOST in back/.env points at ChirpStack's own
# MQTT broker (where LoRaWAN uplinks land natively), so this container is unused
# on the droplet.
#
# Anonymous access is fine on the isolated docker network; real brokers front
# the subscriber with username/password (MQTT_USERNAME/MQTT_PASSWORD) + TLS.
listener 1883
allow_anonymous true
persistence false
