apiVersion: 1

# Loki is the primary datasource (all container + nginx logs). The Postgres
# datasource is OPTIONAL: it powers the "deliveries history" panels straight
# off the existing analytics tables and only connects when the GF_POSTGRES_*
# env vars are set (point them at the same Supabase pooler back/.env uses).
# Loki dashboards work with or without it.
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000

  - name: Agrilogy Postgres
    type: postgres
    uid: agri-postgres
    access: proxy
    url: ${GF_POSTGRES_HOST}:${GF_POSTGRES_PORT}
    user: ${GF_POSTGRES_USER}
    secureJsonData:
      password: ${GF_POSTGRES_PASSWORD}
    jsonData:
      database: ${GF_POSTGRES_DB}
      sslmode: require
      postgresVersion: 1500
