# Single small droplet override (512 MB + swap).
#   cp deploy/droplet/docker-compose.server.yml . && docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
# - Postgres runs here as `agrydata` (the name the entrypoint waits for).
# - Images are built on a laptop (linux/amd64) and loaded; no builds on the box.
# - Redis / mosquitto are loopback-only: Docker publishes bypass ufw.
# - Only nginx (80/443) and the Bivocom bridge (9090) face the internet.
services:
  agrydata:
    container_name: agrydata
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrilogy
      POSTGRES_USER: agrilogy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrilogy -d agrilogy"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [agro]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  redis:
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports: !override ["127.0.0.1:6379:6379"]

  mosquitto:
    ports: !override ["127.0.0.1:1883:1883"]

  agri-api-web:
    build: !reset null
    volumes: !override ["./shared_data:/shared:rw"]
    depends_on: { agrydata: { condition: service_healthy }, redis: { condition: service_healthy } }
  agri-api-fast:
    build: !reset null
    volumes: !override ["./shared_data:/shared:rw"]
  agri-api-worker:
    build: !reset null
    volumes: !override ["./shared_data:/shared:rw"]
  agri-api-beat:
    build: !reset null
    volumes: !override ["./shared_data:/shared:rw"]
  agri-api-mqtt:
    build: !reset null
    volumes: !override ["./shared_data:/shared:rw"]

  agri-bridge:
    image: agri-bridge:latest
    build: !reset null

volumes:
  pgdata: {}
