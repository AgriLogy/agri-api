[project]
name = "agri-api"
version = "1.12.3"
description = "Agrilogy Django backend"
requires-python = ">=3.12"
dependencies = [
    "amqp==5.3.1",
    "asgiref==3.8.1",
    "attrs==25.3.0",
    "billiard==4.2.1",
    "celery==5.5.3",
    "click==8.2.1",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.3.0",
    "colorama==0.4.6",
    "cron-descriptor==1.4.5",
    "Django==4.2.16",
    "django-celery-beat==2.8.1",
    "django-cors-headers==4.4.0",
    "django-cron==0.6.0",
    "django-crontab==0.7.1",
    "django-environ==0.11.2",
    "django-extensions==4.1",
    "django-timezone-field==7.1",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "drf-yasg==1.21.10",
    "et_xmlfile==2.0.0",
    "Faker==35.2.0",
    "importlib_resources==6.5.2",
    "inflection==0.5.1",
    "jsonschema==4.23.0",
    "jsonschema-specifications==2025.4.1",
    "kombu==5.5.4",
    "numpy==2.3.0",
    "openpyxl==3.1.5",
    "packaging==25.0",
    "pandas==2.3.0",
    "prompt_toolkit==3.0.51",
    "psycopg==3.2.6",
    "psycopg2-binary==2.9.10",
    "pydantic>=2.11.10",
    "PyJWT==2.9.0",
    "python-crontab==3.3.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2025.2",
    "PyYAML==6.0.2",
    "redis==6.4.0",
    "referencing==0.36.2",
    "rest-framework-simplejwt==0.0.2",
    "rpds-py==0.24.0",
    "six==1.17.0",
    "sqlparse==0.5.1",
    "swagger-spec-validator==3.0.4",
    "typing_extensions==4.12.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "**/migrations/**",
    "celerybeat-schedule",
    "shared_data",
]

[tool.ruff.lint]
# Conservative starter set — roughly matches the legacy flake8 config so the
# existing codebase stays green. New rule families (N, UP, B, C4, DJ, PT,
# RET, SIM, T20) should be enabled file-by-file or after a global cleanup
# PR; opening a stricter PR right now would either rewrite scientific
# variable names (Rn, ET0, Kc...) or block all merges on legacy debt.
select = [
    "F",    # pyflakes (real bugs)
]
ignore = [
    "F401",   # unused imports — common in Django settings/__init__
    "F403",   # star imports
    "F405",   # may be undefined from star imports
    "F811",   # redefinition (Django app patterns)
    "F841",   # unused local variable
]

[tool.ruff.lint.isort]
known-first-party = ["agriBack", "CustomUser", "analytics"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "agriBack.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
