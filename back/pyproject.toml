[project]
name = "agri-api"
version = "1.64.0"
description = "Agrilogy Django backend"
requires-python = ">=3.12"
dependencies = [
    "amqp==5.3.1",
    "asgiref==3.8.1",
    "attrs==25.3.0",
    "billiard==4.2.1",
    "celery==5.5.3",
    "click==8.2.1",
    "click-didyoumean==0.3.1",
    "click-plugins==1.1.1.2",
    "click-repl==0.3.0",
    "colorama==0.4.6",
    "cron-descriptor==1.4.5",
    "Django==4.2.16",
    "django-celery-beat==2.8.1",
    "django-cors-headers==4.4.0",
    "django-cron==0.6.0",
    "django-crontab==0.7.1",
    "django-environ==0.11.2",
    "django-extensions==4.1",
    "django-timezone-field==7.1",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    # django-ninja for FastAPI-style routers on the new /api/v2/ surface
    # (per memory `agri-api-fastapi-style`). Legacy DRF views stay until
    # each endpoint is migrated.
    "django-ninja>=1.4",
    "drf-yasg==1.21.10",
    "et_xmlfile==2.0.0",
    "Faker==35.2.0",
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",
    "importlib_resources==6.5.2",
    "inflection==0.5.1",
    "jsonschema==4.23.0",
    "jsonschema-specifications==2025.4.1",
    "kombu==5.5.4",
    "numpy==2.3.0",
    "openpyxl==3.1.5",
    "packaging==25.0",
    "pandas==2.3.0",
    "prompt_toolkit==3.0.51",
    "psycopg==3.2.6",
    "psycopg2-binary==2.9.10",
    "pydantic>=2.11.10",
    "PyJWT==2.9.0",
    "python-crontab==3.3.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2025.2",
    "PyYAML==6.0.2",
    "redis==6.4.0",
    "referencing==0.36.2",
    "rest-framework-simplejwt==0.0.2",
    "rpds-py==0.24.0",
    "six==1.17.0",
    "sqlparse==0.5.1",
    "swagger-spec-validator==3.0.4",
    # Relaxed from ==4.12.2: agri-db pulls pydantic>=2.13.4, which needs
    # typing-extensions>=4.14.1. Newer typing-extensions is back-compatible.
    "typing_extensions>=4.14.1",
    # Shared framework-agnostic library (handlers + business logic). Full
    # Revly: pinned by git tag (not @main). agri-core transitively pulls the
    # PRIVATE agri-db, so CI/Docker need AGRI_DB_RO_TOKEN as a git credential
    # for `uv sync` to resolve it.
    "agri-core @ git+https://github.com/AgriLogy/agri-core.git@0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
# src/ layout: tells ruff's isort that first-party packages live under src/.
src = ["src"]
extend-exclude = [
    "**/migrations/**",
    "celerybeat-schedule",
    "shared_data",
]

[tool.ruff.lint]
# Conservative starter set — roughly matches the legacy flake8 config so the
# existing codebase stays green. New rule families (N, UP, B, C4, DJ, PT,
# RET, SIM, T20) should be enabled file-by-file or after a global cleanup
# PR; opening a stricter PR right now would either rewrite scientific
# variable names (Rn, ET0, Kc...) or block all merges on legacy debt.
select = [
    "F",    # pyflakes (real bugs)
]
ignore = [
    "F401",   # unused imports — common in Django settings/__init__
    "F403",   # star imports
    "F405",   # may be undefined from star imports
    "F811",   # redefinition (Django app patterns)
    "F841",   # unused local variable
]

[tool.ruff.lint.isort]
known-first-party = ["agriapi", "CustomUser", "analytics"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "agriapi.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
# src/ layout: put back/src on sys.path so agriapi/apps/analytics import during
# collection (rootdir is back/, so this resolves to back/src).
pythonpath = ["src"]
# NB: coverage flags are intentionally NOT in addopts — they're passed only by
# the CI command (`pytest --cov`). Local / pre-commit runs (which exercise a
# subset and run without Postgres) must not trip the fail_under gate.

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    # Boot / env-specific modules that aren't exercised by the test suite and
    # shouldn't count against coverage:
    "src/agriapi/wsgi.py",
    "src/agriapi/asgi.py",
    "src/agriapi/settings/prod.py",   # runs only in production
    "src/agriapi/settings/test.py",   # settings shim
    "src/agriapi/tests_errors.py",    # not collected (name doesn't match test_*.py)
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Coverage gate (#22): CI runs `pytest --cov`, which fails the build below this
# floor. Current coverage sits above it; ratchet the floor up as it improves.
fail_under = 85

# ---------------------------------------------------------------------------
# python-semantic-release (replaces the old JS semantic-release). Consistent
# with agri-db / agri-core, but agri-api is the top-level app consumed by
# nobody, so it keeps the `v{version}` tag format (matches its existing
# v1.x.y tag history). PSR updates the static `version` here directly via
# version_toml (no _version.py needed) and continues from the latest v-tag.
# Author pinned to mks-zakaria (the old JS workflow released as
# github-actions[bot], violating the sole-author rule).
# ---------------------------------------------------------------------------
[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = ""
commit_message = "chore(release): v{version}\n\n[skip ci] automatically generated by python-semantic-release"
major_on_zero = false
logging_use_named_masks = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.branches.rc]
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "MKS~ZAK <60817481+mks-zakaria@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
