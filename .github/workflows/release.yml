name: release

# Thin caller into AgriLogy/shared-workflows@v1. python-semantic-release runs
# in the shared workflow; PSR config + version live in back/pyproject.toml
# (tags are v{version}, continuing the existing v1.x history). The
# "[skip ci]" head-commit guard and the concurrency group stay HERE — a
# job-level `if:` inside the reusable workflow can't see this repo's event
# payload, and the release commit PSR pushes carries "[skip ci]" so the
# guard prevents a release loop.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "stable (main) or rc (feat|fix|perf branch)"
        type: choice
        options: [stable, rc]
        default: stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: AgriLogy/shared-workflows/.github/workflows/release.yml@v1
    with:
      working_directory: back
      prerelease: ${{ inputs.release_type == 'rc' }}
