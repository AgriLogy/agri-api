name: release

# Auto-release on push to main (the PSR release commit carries "[skip ci]",
# and the guard below double-protects against looping). Manual dispatch also
# supported. Config + version live in back/pyproject.toml, so PSR runs with
# directory: back. Tags are v{version}, continuing the existing v1.x history.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "stable (main) or rc (feat|fix|perf branch)"
        type: choice
        options: [stable, rc]
        default: stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        # Pin the author so release commits are attributed to the user, not
        # github-actions[bot] (per the sole-author rule).
        run: |
          git config user.name "MKS~ZAK"
          git config user.email "60817481+mks-zakaria@users.noreply.github.com"

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: back
          prerelease: ${{ inputs.release_type == 'rc' }}
        env:
          GIT_COMMIT_AUTHOR: "MKS~ZAK <60817481+mks-zakaria@users.noreply.github.com>"
