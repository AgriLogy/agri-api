name: Lint PR title

# Thin caller into AgriLogy/shared-workflows@v1. Squash-merge uses the PR
# title as the squashed commit message, so the title must follow
# Conventional Commits — otherwise semantic-release on main can't classify
# the change. The trigger types below are part of the shared workflow's
# contract (it reads this event's payload).

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    uses: AgriLogy/shared-workflows/.github/workflows/lint-pr-title.yml@v1
