name: Deploy Backend to DigitalOcean

# Thin caller into AgriLogy/shared-workflows@v1. The SSH deploy script
# (git reset → layer-cached image rebuild → entrypoint migrate role →
# `up -d --no-deps` for ONLY our services → image prune) lives in the shared
# deploy-droplet.yml, parameterized here to reproduce the previous inline
# script exactly:
#   - build only agri-api-web (worker/beat run the same image)
#   - migrate role via `bash /code/docker-entrypoint.sh migrate` (a no-op
#     until RUN_DB_MIGRATIONS=true in the droplet env — see
#     docs/MIGRATIONS_PROD_CUTOVER.md)
#   - recreate agri-api-web + agri-api-worker + agri-api-beat + agri-api-fast +
#     agri-api-mqtt with --no-deps so mailpit/redis (owned by the legacy compose
#     project) stay untouched
#   - AGRI_DB_RO_TOKEN forwarded for the private agri-db fetch at build time

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    uses: AgriLogy/shared-workflows/.github/workflows/deploy-droplet.yml@v1
    with:
      repo_dir: /root/agri-api
      branch: main
      build_services: agri-api-web
      migrate_service: agri-api-web
      migrate_command: bash /code/docker-entrypoint.sh migrate
      # agri-api-fast = the FastAPI strangler sidecar (:8001) — same image,
      # started by the pipeline so cutovers never need manual droplet work.
      #
      # agri-api-mqtt = the LoRaWAN/ChirpStack ingest subscriber. It was omitted
      # here, so every deploy left the OLD container running stale code and
      # stale networking until someone ran `up -d --no-deps --force-recreate
      # agri-api-mqtt` by hand. Including it is also what makes the
      # container-name broker route (compose `chirpstack` network) take effect.
      #
      # ⚠️ PRECONDITION on the droplet: the external network named by
      # CHIRPSTACK_NETWORK (default chirpstack_default) MUST exist, otherwise
      # compose refuses the whole `up` and the deploy fails for every service.
      # Verify with `docker network ls | grep -i chirpstack` before the first
      # deploy carrying this change.
      compose_services: agri-api-web agri-api-worker agri-api-beat agri-api-fast agri-api-mqtt
    secrets: inherit
