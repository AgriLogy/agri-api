name: Deploy Backend to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # The private agri-db git dependency needs a read credential at BUILD
          # time. Same secret CI uses (ci.yml). `envs:` forwards it into the
          # remote shell so the rebuild can authenticate the fetch.
          AGRI_DB_RO_TOKEN: ${{ secrets.AGRI_DB_RO_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: AGRI_DB_RO_TOKEN
          # Stop on the first failed command instead of barrelling on and
          # leaving stale code/venv (the old script's `git pull` could abort on
          # local changes while the job still reported success).
          script_stop: true
          # A rebuild (uv sync) can take a few minutes; the default 10m is tight
          # when the deps layer is cold.
          command_timeout: 20m
          # IMPORTANT: single-line commands only. The appleboy SSH action runs
          # this under the droplet's login shell (zsh), and multi-line compound
          # constructs (if/case/for) fail to PARSE there — the whole script then
          # aborts before any command runs. Every line below is a standalone
          # command.
          script: |
            set -eu
            cd /root/agri-api
            git fetch origin main
            git reset --hard origin/main
            AGRI_DB_RO_TOKEN="$AGRI_DB_RO_TOKEN" docker compose -f docker-compose.yml build agri-api-web
            docker compose -f docker-compose.yml up -d --no-deps agri-api-web agri-api-worker agri-api-beat
            docker image prune -f
          # Why ALWAYS rebuild now (vs the old restart-only deploy):
          #   - app code is bind-mounted (./back:/code), but the Python venv is
          #     BAKED into the image. A restart-only deploy picks up new code on
          #     the OLD venv, so any DEPENDENCY change (back/uv.lock or
          #     pyproject.toml — e.g. an agri-core version bump) crashes the app
          #     at import time (ModuleNotFoundError). That caused a 502 outage.
          #   - the build is layer-cached: when deps are unchanged the uv-sync
          #     layer is a cache hit, so code-only deploys stay fast.
          #   - `--no-deps` recreates ONLY the three agri-api services, leaving
          #     mailpit/redis (owned by another compose project) untouched, which
          #     avoids the "container name already in use" conflict.
