name: Deploy Backend to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Stop on the first failed command instead of barrelling on and
          # rebuilding stale code (the old script's `git pull` could abort on
          # local changes while the job still reported success).
          script_stop: true
          # IMPORTANT: single-line commands only. The appleboy SSH action runs
          # this under the droplet's login shell (zsh), and multi-line compound
          # constructs (if/case/for) fail to PARSE there — the whole script then
          # aborts before any command runs. Every line below is a standalone
          # command.
          script: |
            set -eu
            cd /root/agri-api
            git fetch origin main
            git reset --hard origin/main
            docker restart agri-api-web agri-api-worker agri-api-beat
            docker image prune -f
          # Why just reset + restart (no build / no `compose up`):
          #   - app code is bind-mounted (./back:/code), so a code-only deploy
          #     (the overwhelming majority) only needs a restart to take effect;
          #     the web auto-reloads but the celery worker/beat do not.
          #   - `docker compose up -d` conflicts here: mailpit/redis are owned by
          #     another compose project ("container name already in use").
          #   - a rebuild needs AGRI_DB_RO_TOKEN (private agri-db dep), which is
          #     not on the droplet. So DEPENDENCY changes (back/uv.lock or
          #     pyproject.toml) require a one-off manual rebuild on the droplet:
          #       cd /root/agri-api && docker compose build agri-api-web \
          #         && docker compose up -d --no-deps agri-api-web agri-api-worker agri-api-beat
