name: Deploy Backend to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Stop on the first failed command instead of barrelling on and
          # rebuilding stale code (the old script's `git pull` could abort on
          # local changes while the job still reported success).
          script_stop: true
          script: |
            set -eu
            # The public API (back.agrogo-datafarm.com -> :8000 -> agri-api-web)
            # is served from /root/agri-api. The old DO_APP_PATH pointed at the
            # legacy /root/agrilogy-back stack, so deploys never reached the API.
            cd /root/agri-api
            # Force-sync to origin/main. A deploy box should never carry local
            # commits; reset --hard avoids the "your local changes would be
            # overwritten / Aborting" trap (untracked files like the droplet's
            # docker-compose.override.yml are preserved).
            PREV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            NEW=$(git rev-parse HEAD)
            # Rebuild ONLY when dependencies changed. The venv is baked into the
            # image but the app code is bind-mounted (./back:/code), so a
            # code-only change needs no rebuild, and rebuilding pulls the private
            # agri-db dep which requires AGRI_DB_RO_TOKEN. Skipping the build on
            # code-only deploys keeps them working without that token. Build
            # BEFORE swapping: on a bad build, set -e stops here and the running
            # containers keep serving the old image (no downtime).
            # (case glob, no pipe/grep, so it is robust under the SSH shell.)
            CHANGED=$(git diff --name-only "$PREV" "$NEW")
            case "$CHANGED" in
              *back/uv.lock*|*back/pyproject.toml*)
                echo "Dependencies changed -> rebuilding image"
                docker compose build
                ;;
              *)
                echo "No dependency change -> skipping build"
                ;;
            esac
            # Ensure containers exist / pick up any compose changes.
            docker compose up -d
            # Bind-mounted code does NOT hot-reload in the Celery worker/beat
            # (only the web's runserver StatReloader does), and `up -d` won't
            # recreate containers when nothing in their config changed. Restart
            # the app services so the new code actually takes effect.
            docker compose restart agri-api-web agri-api-worker agri-api-beat
            docker image prune -f
