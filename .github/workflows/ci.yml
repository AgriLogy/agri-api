name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      # Caching is intentionally off until the first uv sync commits a
      # back/uv.lock — setup-uv hard-fails when the cache-dependency-glob
      # matches nothing. Re-enable enable-cache + cache-dependency-glob
      # once back/uv.lock is checked in.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.7"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: ruff check
        run: uv run ruff check .

      # Format check is intentionally not enforced in CI yet — the legacy
      # codebase has never been run end-to-end through ruff format. Run
      # `make format` once the lockfile is in, commit the result in a
      # dedicated PR, then re-enable here.

      - name: Django system check
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: agriBack.settings
          SECRET_KEY: ci-placeholder-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: "*"
          USE_POSTGRES: "False"

      - name: Django tests
        run: uv run python manage.py test --noinput
        env:
          DJANGO_SETTINGS_MODULE: agriBack.settings
          SECRET_KEY: ci-placeholder-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          USE_POSTGRES: "False"
