name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    # Postgres so the dual-ORM handler tests run: Django (agri-api) and
    # SQLAlchemy (agri-core via AGRI_DB_URL) share one database. Without it
    # those tests skip (see analytics/tests/test_agronomy.py::_REQUIRES_PG).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      # agri-core (public) transitively pulls the PRIVATE agri-db. Configure
      # the read-only PAT as a git credential so `uv sync` can fetch it.
      - name: Authenticate git for the private agri-db transitive dependency
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.AGRI_DB_RO_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Match the uv that writes uv.lock (revision 3); 0.5.7 can't parse it.
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      # Format check is intentionally not enforced in CI yet — the legacy
      # codebase has never been run end-to-end through ruff format. Run
      # `make format` once the lockfile is in, commit the result in a
      # dedicated PR, then re-enable here.

      - name: Django system check
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: agriapi.settings
          SECRET_KEY: ci-placeholder-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: "*"
          USE_POSTGRES: "False"

      # We run pytest (pytest-django) because the project's test
      # configuration lives in pyproject.toml's [tool.pytest.ini_options]
      # and several test files rely on pytest fixtures (admin_user,
      # admin_client, zone_factory, …) declared in `conftest.py`.
      # pytest-django picks up legacy `django.test.TestCase`-based tests
      # too, so this is a superset of `manage.py test`.
      #
      # Run the whole src/ tree so the device-ingest tests (bivocom,
      # lorawan/chirpstack) and the agriapi end-to-end workflow test gate
      # merges too — not just apps/users + analytics. Postgres (service above)
      # lets the dual-ORM handler tests run instead of skipping.
      - name: Backend tests (pytest)
        run: uv run pytest src/ -v
        env:
          DJANGO_SETTINGS_MODULE: agriapi.settings
          SECRET_KEY: ci-placeholder-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          # Postgres (the service above) so the dual-ORM tests run, not skip.
          # conftest.py binds AGRI_DB_URL to Django's test DB.
          USE_POSTGRES: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
