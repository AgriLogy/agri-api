name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.7"
          enable-cache: true
          cache-dependency-glob: back/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      # Format check is intentionally not enforced in CI yet — the legacy
      # codebase has never been run end-to-end through ruff format. Run
      # `make format` once the lockfile is in, commit the result in a
      # dedicated PR, then re-enable here.

      - name: Django system check
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: agriBack.settings
          SECRET_KEY: ci-placeholder-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: "*"
          USE_POSTGRES: "False"

      # We run pytest (pytest-django) because the project's test
      # configuration lives in pyproject.toml's [tool.pytest.ini_options]
      # and several test files rely on pytest fixtures (admin_user,
      # admin_client, zone_factory, …) declared in `conftest.py`.
      # pytest-django picks up legacy `django.test.TestCase`-based tests
      # too, so this is a superset of `manage.py test`.
      - name: Backend tests (pytest)
        run: uv run pytest apps/users/ analytics/ -v
        env:
          DJANGO_SETTINGS_MODULE: agriBack.settings
          SECRET_KEY: ci-placeholder-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          USE_POSTGRES: "False"
          EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
