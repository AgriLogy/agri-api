## Agrilogy backend stack — Supabase-hosted Postgres + local Redis, Django
## (web), Celery worker, Celery beat, Mailpit, optional Node bridge.
##
## Conventions:
##   - `back/.env` is the source of truth for secrets, including the
##     Supabase POSTGRES_* values (Session pooler endpoint).
##   - Every service runs from the same image (built once) and is
##     specialised by its `command`.
##   - Healthchecks gate the dependency graph so `docker compose up`
##     finishes only when Django is actually serving.
##
## Postgres lives on Supabase (no local container). Browse it via the
## Supabase Studio dashboard instead of Adminer.

# Bounded log rotation for EVERY service. The default json-file driver keeps
# growing unbounded, which on the single droplet is a disk-fill risk (and the
# same files Promtail tails for the Loki observability stack — see
# deploy/observability/). 10MB × 5 files ≈ 50MB/container ceiling.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------- Mailpit (SMTP capture; UI :8025, SMTP :1025) ------------
  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    logging: *default-logging
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks: [agro]

  # ---------- Redis ---------------------------------------------------
  redis:
    container_name: redis
    image: redis:7-alpine
    logging: *default-logging
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks: [agro]

  # ---------- Mosquitto (dev MQTT broker; :1883) ----------------------
  # Local broker so `make up` exercises the full MQTT ingest path offline.
  # NOT used in prod: on the droplet MQTT_HOST (back/.env) points at
  # ChirpStack's own broker, where LoRaWAN uplinks are published natively —
  # this container just idles there. Config: deploy/mosquitto/mosquitto.conf.
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    logging: *default-logging
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks: [agro]

  # ---------- agri-bridge — stateless HTTP ingest gateway -----------
  # Receives Router0X-format payloads from field devices, translates to
  # the Bivocom v1 wire format, forwards to agri-api. Sources live in
  # the sibling AgriLogy/agri-bridge repo so the gateway can ship on
  # its own cadence; we build from the local sibling checkout for dev
  # velocity. Prod deploys can swap in a registry image with no
  # service-level changes here.
  agri-bridge:
    container_name: agri-bridge
    build:
      context: ../agri-bridge
      dockerfile: Dockerfile
    logging: *default-logging
    environment:
      PORT: 9090
      BACKEND_URL: http://agri-api-web:8000
      BACKEND_PATH: /api/v1/bivocom/uplink
      LOG_LEVEL: info
    ports:
      - "9090:9090"
    depends_on:
      agri-api-web:
        condition: service_healthy
    restart: unless-stopped
    networks: [agro]

  # ---------- Django (web) --------------------------------------------
  agri-api-web:
    container_name: agri-api-web
    image: agri-api:latest
    logging: *default-logging
    build:
      context: ./back
      dockerfile: Dockerfile
      secrets:
        - agri_db_token
    env_file: ./back/.env
    environment:
      # Postgres connection comes from back/.env (Supabase pooler).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_RUN_MODE: web
      DJANGO_ENV: ${DJANGO_ENV:-dev}
    command: ["bash", "/code/docker-entrypoint.sh", "web"]
    ports:
      - "8000:8000"
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/admin/login/').status<500 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 180s grace: the web role runs a chain of ensure_*_tables scripts (each a
      # Supabase/agrydata round-trip) + the dev-server reloader before it serves,
      # which can take >3min. A short start_period made `compose up --wait` mark
      # web unhealthy → the deploy FAILED and left worker/beat stranded in
      # `created` (Celery silently down). See the depends_on note below.
      start_period: 180s
    restart: unless-stopped
    networks: [agro]

  # ---------- FastAPI sidecar (fast) ----------------------------------
  # The strangler-fig target: same image + env as agri-api-web, but uvicorn
  # serves back/src/fastapp on :8001. nginx on the droplet moves path
  # prefixes from :8000 (Django) to :8001 one cutover at a time — see
  # deploy/nginx/back.conf.
  agri-api-fast:
    container_name: agri-api-fast
    image: agri-api:latest
    logging: *default-logging
    build:
      context: ./back
      dockerfile: Dockerfile
      secrets:
        - agri_db_token
    env_file: ./back/.env
    environment:
      # Postgres connection comes from back/.env (Supabase pooler).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_RUN_MODE: fast
      DJANGO_ENV: ${DJANGO_ENV:-dev}
    command: ["bash", "/code/docker-entrypoint.sh", "fast"]
    ports:
      - "8001:8001"
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status<500 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [agro]

  # ---------- Celery worker -------------------------------------------
  agri-api-worker:
    container_name: agri-api-worker
    image: agri-api:latest
    logging: *default-logging
    build:
      context: ./back
      dockerfile: Dockerfile
      secrets:
        - agri_db_token
    env_file: ./back/.env
    environment:
      # Postgres connection comes from back/.env (Supabase pooler).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_RUN_MODE: fast-worker
      DJANGO_ENV: ${DJANGO_ENV:-dev}
    # F10 cutover: the native (Django-free) Celery worker running the ported task
    # bodies (fastapp.celery_app), same agriapi.tasks.* names + agriapi queue.
    # Rollback = set this back to "worker" (Django app) and redeploy.
    command: ["bash", "/code/docker-entrypoint.sh", "fast-worker"]
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      # service_started, NOT service_healthy: worker/beat/mqtt wait for Postgres
      # + Redis themselves (docker-entrypoint.sh), so they don't need web to be
      # HEALTHY — only started. Gating on health meant web's slow startup left
      # these stranded in `created` when the deploy's --wait timed out.
      agri-api-web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [agro]

  # ---------- Celery beat ---------------------------------------------
  agri-api-beat:
    container_name: agri-api-beat
    image: agri-api:latest
    logging: *default-logging
    build:
      context: ./back
      dockerfile: Dockerfile
      secrets:
        - agri_db_token
    env_file: ./back/.env
    environment:
      # Postgres connection comes from back/.env (Supabase pooler).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_RUN_MODE: fast-beat
      DJANGO_ENV: ${DJANGO_ENV:-dev}
    # F10 cutover: native Celery beat with the static schedule (cadences matched
    # to the live PeriodicTask rows). Rollback = set this back to "beat"
    # (DatabaseScheduler) and redeploy.
    command: ["bash", "/code/docker-entrypoint.sh", "fast-beat"]
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      # service_started, NOT service_healthy: worker/beat/mqtt wait for Postgres
      # + Redis themselves (docker-entrypoint.sh), so they don't need web to be
      # HEALTHY — only started. Gating on health meant web's slow startup left
      # these stranded in `created` when the deploy's --wait timed out.
      agri-api-web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [agro]

  # ---------- MQTT ingest subscriber ----------------------------------
  # Persistent paho subscriber (docker-entrypoint.sh mqtt → fastapp.mqtt) that
  # consumes ChirpStack LoRaWAN uplinks + the generic {prefix}/{client}/... topic
  # tree and writes through the SAME fastapp.ingest handlers the HTTP /ingest/*
  # webhooks use — additive, so HTTP keeps working (rollback = stop this one).
  #
  # Broker: MQTT_HOST defaults to the dev `mosquitto` above; the droplet sets
  # MQTT_HOST (+ MQTT_USERNAME/MQTT_PASSWORD/MQTT_TLS) in back/.env → ChirpStack's
  # broker. Tolerates the broker being down at boot (connect_async + retry).
  #
  # ⚠️ Do NOT scale to >1 replica: every subscriber receives every message, so N
  # replicas = N× writes and N× alert emails.
  agri-api-mqtt:
    container_name: agri-api-mqtt
    image: agri-api:latest
    logging: *default-logging
    build:
      context: ./back
      dockerfile: Dockerfile
      secrets:
        - agri_db_token
    env_file: ./back/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_RUN_MODE: mqtt
      DJANGO_ENV: ${DJANGO_ENV:-dev}
      # Dev default targets the mosquitto container; back/.env overrides on prod.
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
    command: ["bash", "/code/docker-entrypoint.sh", "mqtt"]
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      # service_started, NOT service_healthy: worker/beat/mqtt wait for Postgres
      # + Redis themselves (docker-entrypoint.sh), so they don't need web to be
      # HEALTHY — only started. Gating on health meant web's slow startup left
      # these stranded in `created` when the deploy's --wait timed out.
      agri-api-web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [agro]

networks:
  # Postgres (agrydata), redis, and mailpit live in the legacy "agrilogy-back"
  # compose project's network. Attach to it as EXTERNAL so RECREATED containers
  # (the deploy rebuild does `up -d`, not just `restart`) can still resolve
  # agrydata/redis by name. A non-external `agro` would create an isolated
  # `agri-api_agro` network → "postgres not reachable at agrydata:5432" → 502.
  agro:
    external: true
    name: agrilogy-back_agro

# Build-time secret: read-only PAT for the PRIVATE agri-db, which agri-core
# transitively pulls. Sourced from the AGRI_DB_RO_TOKEN env var on the build
# host (set it in the droplet's shell/.env before `docker compose up --build`).
# The Dockerfile only uses it if non-empty, so builds without it still work.
secrets:
  agri_db_token:
    environment: AGRI_DB_RO_TOKEN
