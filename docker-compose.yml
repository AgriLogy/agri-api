## Agrilogy backend stack — Supabase-hosted Postgres + local Redis, Django
## (web), Celery worker, Celery beat, Mailpit, optional Node bridge.
##
## Conventions:
##   - `back/.env` is the source of truth for secrets, including the
##     Supabase POSTGRES_* values (Session pooler endpoint).
##   - Every service runs from the same image (built once) and is
##     specialised by its `command`.
##   - Healthchecks gate the dependency graph so `docker compose up`
##     finishes only when Django is actually serving.
##
## Postgres lives on Supabase (no local container). Browse it via the
## Supabase Studio dashboard instead of Adminer.

services:
  # ---------- Mailpit (SMTP capture; UI :8025, SMTP :1025) ------------
  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks: [agro]

  # ---------- Redis ---------------------------------------------------
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks: [agro]

  # ---------- Optional Node bridge (writes shared_data/requests.json) -
  agri-bridge:
    container_name: agri-bridge
    build:
      context: ./Devops/server
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - ./shared_data:/shared_data:rw
    restart: unless-stopped
    networks: [agro]

  # ---------- Django (web) --------------------------------------------
  agri-api-web:
    container_name: agri-api-web
    image: agri-api:latest
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file: ./back/.env
    environment:
      # Postgres connection comes from back/.env (Supabase pooler).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Default email goes to Mailpit when running compose; override in
      # back/.env to point at Gmail in production.
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      DJANGO_RUN_MODE: web
    command: ["bash", "/code/docker-entrypoint.sh", "web"]
    ports:
      - "8000:8000"
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/admin/login/').status<500 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [agro]

  # ---------- Celery worker -------------------------------------------
  agri-api-worker:
    container_name: agri-api-worker
    image: agri-api:latest
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file: ./back/.env
    environment:
      # Postgres connection comes from back/.env (Supabase pooler).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      DJANGO_RUN_MODE: worker
    command: ["bash", "/code/docker-entrypoint.sh", "worker"]
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      agri-api-web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [agro]

  # ---------- Celery beat ---------------------------------------------
  agri-api-beat:
    container_name: agri-api-beat
    image: agri-api:latest
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file: ./back/.env
    environment:
      # Postgres connection comes from back/.env (Supabase pooler).
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      DJANGO_RUN_MODE: beat
    command: ["bash", "/code/docker-entrypoint.sh", "beat"]
    volumes:
      - ./back:/code:delegated
      - ./shared_data:/shared:rw
    depends_on:
      agri-api-web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [agro]

networks:
  agro:
