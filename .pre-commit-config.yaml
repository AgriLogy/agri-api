# Optional: install with `uvx pre-commit install` if you prefer the
# pre-commit framework over our native .githooks/. Both run ruff identically.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Conventional Commits — semantic-release parses commit messages to compute
  # the next version, so enforce the format on commit-msg.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # Pre-push gate — catch lint / test / release-config breakage locally
  # before it reaches CI. The project lives in back/, so each hook cd's in.
  # Enable with: pre-commit install --hook-type pre-push
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd back && uv run ruff check .'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest (apps/users + analytics)
        entry: bash -c 'cd back && DJANGO_SETTINGS_MODULE=agriapi.settings SECRET_KEY=ci DEBUG=True ALLOWED_HOSTS="*" USE_POSTGRES=False EMAIL_BACKEND="django.core.mail.backends.locmem.EmailBackend" uv run pytest src/apps/users/ src/analytics/ -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: semantic-release-config
        name: validate semantic-release config (no-op version --print)
        entry: bash -c 'cd back && uvx --from python-semantic-release semantic-release -c pyproject.toml version --print'
        language: system
        pass_filenames: false
        stages: [pre-push]
